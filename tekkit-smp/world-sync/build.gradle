buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://plugins.gradle.org/m2/' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
        classpath 'com.github.jengelman.gradle.plugins:shadow:4.0.4'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'eclipse'

version = "${file('VERSION').text.trim()}-mc1.12.2"
group = 'com.gabrielgollo'
archivesBaseName = 'gabrielgollo_world-sync'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
        }
    }
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    shade 'software.amazon.awssdk:s3:2.25.60'
    shade 'software.amazon.awssdk:url-connection-client:2.25.60'
}

processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

shadowJar {
    configurations = [project.configurations.shade]
    classifier = ''
    relocate 'software.amazon.awssdk', 'com.gabrielgollo.worldsync.internal.awssdk'
    relocate 'software.amazon.eventstream', 'com.gabrielgollo.worldsync.internal.eventstream'
    relocate 'org.reactivestreams', 'com.gabrielgollo.worldsync.internal.reactivestreams'
    destinationDir = file("$projectDir/dist")
    manifest.attributes([
        'Specification-Title': 'gabrielgollo_World Sync',
        'Specification-Vendor': 'Gabriel Gollo',
        'Specification-Version': project.version,
        'Implementation-Title': archivesBaseName,
        'Implementation-Version': project.version
    ])
}

reobf {
    shadowJar {}
}

build.dependsOn reobfShadowJar
